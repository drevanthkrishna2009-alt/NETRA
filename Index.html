<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA-ROVER MONITORING SYSTEM</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
</head>
<body>
    <style>
        /* =====Global Reset======= */

*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html{
    scroll-behavior: smooth;
}

body{
    background-color: rgb(48, 2, 2, 0.471);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

button{
    font-family: inherit;
     background: #287ee8;
    color: rgb(248, 244, 244);
    font-weight: bold;
    border: 0;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
}



.topbar{
    min-height: 82px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap:20px;
    padding: 15px 4%;
    background: rgb(2, 48, 76);
    border-bottom: 1px solid rgb(246, 238, 5);
}

.brand{
    display: flex;
    gap:12px;
    align-items: center;
}
.brand-logo{
    background: rgb(57, 5, 246);
    border-radius: 50%;
    padding: 12px 16px;
    font-weight: bold;
    font-size: 23px;
}
.brand h1{
    color: #54f2ff;
    letter-spacing: 3px;
}
.brand p{
    color: rgb(166, 28, 28);
    font-size: 12px;
}
nav{
    display: flex;
    gap: 20px;  
}
nav a{
    color: rgb(210, 32, 85);
    text-decoration: none;
    font-size: 15px;
}
nav a:hover{
    color: rgb(11, 194, 14);
}
.header-right{
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgb(0, 255, 0);
    font-size: 14px;}
    .online-dot{
        width: 10px;
        height: 10px;
        background: rgb(0, 255, 0);
        border-radius: 50%;
    }
    #clock{
            color: rgb(54, 198, 18);
        font-size: 16px;
        font-weight: bold;
        font-family: monospace;
    }
    
    </style>
    <header class="topbar">
        <!-- This is for logo and title -->
        <div class="brand">
            <div class="brand-logo">N</div>
            <div>
                <h1>NETRA</h1>
                <p>Robot Mission Control</p>
            </div>
        </div>

        <!-- This block for navigation section -->
        <nav>
            <a href="#Dashboard">Dashboard</a>
            <a href="#Fleet">Fleet</a>
            <a href="#Telemetry">Telemetry</a>
            <a href="#Alerts">Alerts</a>
        </nav>

        <!-- This block shows the system online, timing -->
        <div class="header-right">
            <span class="online-dot"></span>
            <span>SYSTEM ONLINE</span>
            <strong id="clock">--:--:--</strong>
        </div>

        <!-- This is for dispatch mission button -->
        <button id="dispatch-open" type="button">+Dispatch Mission</button>

    </header>
    
</body>
</html>
